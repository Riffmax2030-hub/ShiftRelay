<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="sr-c3-teal" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a3d39"/>
      <stop offset="1" stop-color="#0d524d"/>
    </linearGradient>
    <linearGradient id="sr-c3-mint" x1="40" y1="40" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10b981"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- Background rounded canvas -->
  <rect width="120" height="120" rx="28" fill="#ffffff"/>
  <!-- Outgoing shift link (upper hexagon) -->
  <polygon points="46,20 74,20 88,44 74,68 46,68 32,44" 
           stroke="url(#sr-c3-teal)" stroke-width="9" stroke-linejoin="round"/>
  <!-- Incoming shift link (lower interlocking hexagon) -->
  <polygon points="46,52 74,52 88,76 74,100 46,100 32,76" 
           stroke="url(#sr-c3-mint)" stroke-width="9" stroke-linejoin="round"/>
  <!-- Central joint node -->
  <circle cx="60" cy="60" r="6" fill="#ffffff" stroke="#0d524d" stroke-width="3"/>
</svg>
