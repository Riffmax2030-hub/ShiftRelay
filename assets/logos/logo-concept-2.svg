<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="sr-c2-grad" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0d524d"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Background rounded canvas -->
  <rect width="120" height="120" rx="28" fill="#ffffff"/>
  <!-- Circular 24h dial track -->
  <circle cx="60" cy="60" r="42" stroke="#e2e8f0" stroke-width="7" stroke-dasharray="4 6"/>
  <!-- Active completed quadrant arc -->
  <path d="M60 18 A42 42 0 0 1 102 60" stroke="#0d524d" stroke-width="9" stroke-linecap="round"/>
  <!-- Dynamic Handover Verification Checkmark -->
  <path d="M42 60 L54 72 L82 42" stroke="url(#sr-c2-grad)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dial 12 o'clock marker -->
  <circle cx="60" cy="18" r="5" fill="#10b981"/>
</svg>
