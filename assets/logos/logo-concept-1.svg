<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="sr-c1-teal" x1="10" y1="20" x2="90" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a3d39"/>
      <stop offset="0.6" stop-color="#0d524d"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="sr-c1-glow" x1="40" y1="20" x2="110" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="sr-c1-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0d524d" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background rounded canvas -->
  <rect width="120" height="120" rx="28" fill="#ffffff"/>
  <!-- Primary baton passing loop -->
  <g filter="url(#sr-c1-shadow)">
    <!-- Base track arc (outgoing shift) -->
    <path d="M30 72 C22 52 36 30 58 30 C76 30 90 42 90 60 C90 78 74 90 56 90 C42 90 32 82 28 72" 
          stroke="url(#sr-c1-teal)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Overlapping interlock arc (incoming shift handover) -->
    <path d="M42 42 C54 26 82 24 92 46 C100 64 88 84 68 84 C54 84 46 76 42 66" 
          stroke="url(#sr-c1-glow)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>
    <!-- Relay Node -->
    <circle cx="68" cy="84" r="5.5" fill="#10b981" stroke="#ffffff" stroke-width="2.5"/>
    <circle cx="58" cy="30" r="4.5" fill="#0d524d" stroke="#ffffff" stroke-width="2"/>
  </g>
</svg>
