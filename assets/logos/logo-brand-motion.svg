<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="srDarkGreenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07291E"/>
      <stop offset="55%" stop-color="#041B14"/>
      <stop offset="100%" stop-color="#02100C"/>
    </linearGradient>
    <radialGradient id="srEmeraldAmbient" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#1AD079" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1AD079" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="srRidgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="65%" stop-color="#D1FAE5"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="srGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Deep Dark Green Squircle Background -->
  <rect x="4" y="4" width="312" height="312" rx="56" fill="url(#srDarkGreenBg)" stroke="#1AD079" stroke-opacity="0.32" stroke-width="2.5" />
  <circle cx="160" cy="128" r="130" fill="url(#srEmeraldAmbient)" />

  <!-- Biometric Fingerprint + Keyhole Lock Mark (Centered Upper Stage) -->
  <g transform="translate(156, 120)" fill="none" stroke="url(#srRidgeGrad)" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#srGlow)">
    <!-- Outer Top Arch -->
    <path d="M -46 -42 C -32 -78, 32 -78, 48 -38 C 54 -22, 54 -4, 52 14" />
    <!-- Left Upper Ridge -->
    <path d="M -54 -14 C -52 -42, -34 -62, -6 -64 C 24 -66, 40 -44, 40 -14 C 40 4, 38 18, 48 28" />
    <!-- Inner Swirl Loop & Ridge Lines -->
    <path d="M -54 4 C -36 2, -24 -12, -20 -32 C -16 -48, 0 -52, 14 -46 C 26 -40, 28 -22, 26 -2 C 24 16, 28 30, 46 38" />
    <path d="M -52 22 C -30 18, -14 2, -8 -22 C -4 -36, 12 -34, 14 -18 C 16 2, 12 22, 24 38" />
    <path d="M -46 38 C -24 32, -6 16, 0 -10" />
    <!-- Y-Branch Ridge Core above Lower Arch -->
    <path d="M -18 28 C -6 22, 6 22, 18 32" />
    <path d="M -2 10 L 4 23" />
    <!-- Bottom Concentric Arch Ridges (curving left of the keyhole badge) -->
    <path d="M -44 52 C -26 38, -2 36, 12 46" />
    <path d="M -38 68 C -22 54, -4 54, 8 64" />
    <path d="M -26 82 C -14 72, -2 72, 6 80" />
    <path d="M -14 92 C -8 87, -2 87, 3 91" />

    <!-- Circular Keyhole Lock Badge (Bottom-Right of Fingerprint) -->
    <g transform="translate(36, 62)" stroke="none">
      <circle cx="0" cy="0" r="30" fill="#1AD079" />
      <!-- Keyhole Cutout in Deep Dark Green -->
      <circle cx="0" cy="-6" r="8.5" fill="#041B14" />
      <path d="M -5 -1 L 5 -1 L 8.5 15 L -8.5 15 Z" fill="#041B14" />
    </g>
  </g>

  <!-- SHIFTRELAY Wordmark (Emerald SHIFT + Crisp Mint-White RELAY with 3-bar E & Interlocked AY) -->
  <g transform="translate(26, 242) scale(0.84)">
    <!-- S (Emerald Green #1AD079) -->
    <path d="M 27 8 C 24 3, 18 1, 11 1 C 3 1, -2 5, -2 12 C -2 19, 4 21, 13 23 C 19 24.5, 21 26, 21 29.5 C 21 33, 17 35, 11 35 C 5 35, 1 32, -2 28 L -8 34 C -4 40, 3 43, 11 43 C 22 43, 30 38, 30 29 C 30 21, 24 18, 14 16 C 8 14.5, 6 13, 6 10.5 C 6 8, 9 6.5, 13 6.5 C 17 6.5, 20 8, 22 11 Z" fill="#1AD079"/>

    <!-- H (Emerald Green #1AD079) -->
    <path d="M 38 2 H 47 V 18 H 64 V 2 H 73 V 42 H 64 V 26 H 47 V 42 H 38 Z" fill="#1AD079"/>

    <!-- I (Emerald Green #1AD079) -->
    <rect x="82" y="2" width="9" height="40" fill="#1AD079"/>

    <!-- F (Emerald Green #1AD079) -->
    <path d="M 100 2 H 126 V 10 H 109 V 19 H 123 V 27 H 109 V 42 H 100 Z" fill="#1AD079"/>

    <!-- T (Emerald Green #1AD079) -->
    <path d="M 130 2 H 160 V 10 H 149.5 V 42 H 140.5 V 10 H 130 Z" fill="#1AD079"/>

    <!-- R (Crisp Mint-White #ECFDF5 for contrast on Dark Green) -->
    <path d="M 165 2 H 183 C 192 2, 198 7, 198 15 C 198 21, 194 25.5, 188 27 L 199 42 H 188.5 L 179 28 H 174 V 42 H 165 Z M 174 10 V 20.5 H 182 C 186.5 20.5, 189 18.5, 189 15 C 189 11.8, 186.5 10, 182 10 Z" fill="#ECFDF5"/>

    <!-- E (Stylized 3 Horizontal Bars: Top & Bottom #ECFDF5, Middle Bar Emerald #1AD079) -->
    <rect x="204" y="2" width="24" height="8.5" fill="#ECFDF5"/>
    <rect x="204" y="17.8" width="24" height="8.5" fill="#1AD079"/>
    <rect x="204" y="33.5" width="24" height="8.5" fill="#ECFDF5"/>

    <!-- L (Crisp Mint-White #ECFDF5) -->
    <path d="M 235 2 H 244 V 33.5 H 261 V 42 H 235 Z" fill="#ECFDF5"/>

    <!-- Interlocked AY (Crisp Mint-White #ECFDF5) -->
    <path d="M 278 2 L 263 42 H 272.5 L 275.5 33.5 H 291 V 25.5 H 278.5 L 283 12.5 L 294 42 H 303 L 287 2 Z" fill="#ECFDF5"/>
    <path d="M 289 2 L 301 23 V 42 H 310 V 23 L 322 2 H 312.5 L 305.5 15 L 298.5 2 Z" fill="#ECFDF5"/>
  </g>
</svg>