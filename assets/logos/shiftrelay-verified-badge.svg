      <stop offset="50%" stop-color="#091729"/>
      <stop offset="100%" stop-color="#050e1a"/>
    </linearGradient>
    <linearGradient id="rosetteEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
