<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Titanium Obsidian -->
    <linearGradient id="osBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A111F"/>
      <stop offset="42%" stop-color="#060A13"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Metallic Edge Bezel -->
    <linearGradient id="osBezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#0284C7" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#1E293B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Radial Ambient Glow -->
    <radialGradient id="osAmbientCyan" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#0284C7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Isometric Facet Gradients -->
    <!-- Top Face (Cloud / Fleet Control) -->
    <linearGradient id="isoTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Left Face (Multi-Tenant Relays) -->
    <linearGradient id="isoLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Right Face (Telemetry & Banking) -->
    <linearGradient id="isoRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C4A6E"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>

    <!-- Dynamic Relay Chevron Gradient -->
    <linearGradient id="relayChevronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- OS Badge Radial Gradient -->
    <linearGradient id="osBadgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#040812"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>

    <linearGradient id="osTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <filter id="osGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#00F2FE" flood-opacity="0.32"/>
    </filter>

    <filter id="osCardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Deep Titanium Squircle Outer Shell (iOS / macOS / Windows standard 512 squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#osBgGrad)" stroke="url(#osBezelGrad)" stroke-width="4.5" filter="url(#osCardShadow)"/>

  <!-- Subtle High-Tech Blueprint Matrix Grid Lines -->
  <g opacity="0.07" stroke="#38BDF8" stroke-width="1.2">
    <line x1="16" y1="128" x2="496" y2="128"/>
    <line x1="16" y1="256" x2="496" y2="256"/>
    <line x1="16" y1="384" x2="496" y2="384"/>
    <line x1="128" y1="16" x2="128" y2="496"/>
    <line x1="256" y1="16" x2="256" y2="496"/>
    <line x1="384" y1="16" x2="384" y2="496"/>
  </g>

  <!-- Ambient Light Dome -->
  <circle cx="256" cy="200" r="190" fill="url(#osAmbientCyan)"/>

  <!-- =====================================================================
       CENTRAL EMBLEM: ISOMETRIC ENTERPRISE COMMAND NEXUS & RELAY ORBIT
       ===================================================================== -->

  <!-- Outer Orbital Telemetry Ring (Angled -28deg) -->
  <g transform="translate(240, 204) rotate(-28)" opacity="0.85">
    <!-- Orbital Track -->
    <ellipse cx="0" cy="0" rx="150" ry="58" fill="none" stroke="#0284C7" stroke-width="2.5" stroke-dasharray="14 10" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="150" ry="58" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="48 240"/>
    <!-- Orbital Satellite Nodes -->
    <circle cx="-150" cy="0" r="5" fill="#38BDF8" filter="url(#osGlow)"/>
    <circle cx="150" cy="0" r="4" fill="#10B981"/>
    <circle cx="0" cy="-58" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Isometric Hex-Cube Command Core -->
  <g transform="translate(240, 204)">
    <!-- Top Isometric Facet (Operations & Workforce Control) -->
    <path d="M 0 -84 L 80 -38 L 0 8 L -80 -38 Z" fill="url(#isoTopGrad)" stroke="#38BDF8" stroke-width="2" stroke-linejoin="round" opacity="0.95"/>
    <!-- Top Grid Detail -->
    <path d="M -40 -15 L 40 -61 M -40 -61 L 40 -15" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Left Isometric Facet (Security & Multi-Tenant Core) -->
    <path d="M -80 -38 L 0 8 L 0 100 L -80 54 Z" fill="url(#isoLeftGrad)" stroke="rgba(56,189,248,0.4)" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Left Circuit Lines -->
    <path d="M -60 -10 L -60 40 M -35 5 L -35 65 M -15 20 L -15 80" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
    <circle cx="-60" cy="40" r="2.5" fill="#38BDF8" opacity="0.7"/>
    <circle cx="-35" cy="5" r="2.5" fill="#38BDF8" opacity="0.7"/>

    <!-- Right Isometric Facet (Settlement Rails & Telemetry) -->
    <path d="M 0 8 L 80 -38 L 80 54 L 0 100 Z" fill="url(#isoRightGrad)" stroke="rgba(16,185,129,0.5)" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Right Data Stream Lines -->
    <path d="M 25 22 L 65 -1 M 25 50 L 65 27 M 25 78 L 55 61" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" opacity="0.45"/>
    <circle cx="65" cy="-1" r="2.5" fill="#10B981"/>
    <circle cx="25" cy="50" r="2.5" fill="#10B981"/>

    <!-- Center Floating High-Tech Relay Glyph: The "Relay Chevron" Monogram -->
    <g transform="translate(0, -6)" filter="url(#osGlow)">
      <!-- Dual Interlocking Shift Arrows (ShiftRelay Kinetic DNA) -->
      <!-- Upper Arrow Right -->
      <path d="M -24 -24 L 8 -24 L 20 -12 L 8 0 L -8 0" fill="none" stroke="url(#relayChevronGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="18,-12 11,-17 11,-7" fill="#FFFFFF"/>
      <!-- Lower Arrow Left -->
      <path d="M 24 16 L -8 16 L -20 4 L -8 -8 L 8 -8" fill="none" stroke="url(#relayChevronGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="-18,4 -11,9 -11,-1" fill="#38BDF8"/>
      <!-- Core Quantum Beacon -->
      <circle cx="0" cy="-4" r="5" fill="#FFFFFF" filter="url(#osGlow)"/>
    </g>
  </g>

  <!-- =====================================================================
       EXECUTIVE "OS" COMMAND CORE BADGE (Distinct Anchor In Lower Section)
       ===================================================================== -->
  <g transform="translate(356, 362)" filter="url(#osCardShadow)">
    <!-- Outer Floating Glass Squircle Badge -->
    <rect x="-62" y="-48" width="124" height="96" rx="28" fill="url(#osBadgeBg)" stroke="url(#osTextGrad)" stroke-width="3"/>
    
    <!-- Status Telemetry Beacon -->
    <circle cx="-34" cy="-24" r="4.5" fill="#00F2FE" filter="url(#osGlow)"/>
    <circle cx="-34" cy="-24" r="9" fill="none" stroke="#00F2FE" stroke-width="1.2" opacity="0.45"/>

    <!-- Label: "OPERATING SYSTEM" Micro-Caps -->
    <text x="2" y="-21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" letter-spacing="0.14em" fill="#94A3B8">CONTROL</text>

    <!-- Bold Monogram "OS" -->
    <text x="0" y="24" text-anchor="middle" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="900" letter-spacing="0.05em" fill="url(#osTextGrad)" filter="url(#osGlow)">OS</text>
  </g>

  <!-- Lower Left Platform Label: SHIFTRELAY OS -->
  <g transform="translate(64, 428)">
    <text x="0" y="0" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" letter-spacing="0.12em">
      <tspan fill="#F8FAFC">SHIFT</tspan><tspan fill="#38BDF8">RELAY</tspan>
    </text>
    <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" letter-spacing="0.26em" fill="#64748B">ENTERPRISE PLATFORM</text>
  </g>
</svg>