<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <linearGradient id="osDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>
    <radialGradient id="osCyanAmbient" cx="50%" cy="40%" r="56%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#0ea5e9" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="osRidgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="55%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="osBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="osGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Deep Obsidian-Slate Squircle Background -->
  <rect x="6" y="6" width="308" height="308" rx="64" fill="url(#osDarkBg)" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="4.5"/>
  <rect x="16" y="16" width="288" height="288" rx="54" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="1.5"/>
  <circle cx="160" cy="136" r="132" fill="url(#osCyanAmbient)"/>

  <!-- Precision Corner OS Reticle Accents -->
  <g stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M 38 56 L 38 40 L 54 40"/>
    <path d="M 266 40 L 282 40 L 282 56"/>
    <path d="M 38 264 L 38 280 L 54 280"/>
  </g>

  <!-- Biometric Fingerprint Identity Mark (Platinum-Cyan Variant) -->
  <g transform="translate(156, 126)" fill="none" stroke="url(#osRidgeGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#osGlow)">
    <!-- Outer Top Arch -->
    <path d="M -46 -42 C -32 -78, 32 -78, 48 -38 C 54 -22, 54 -4, 52 14"/>
    <!-- Left Upper Ridge -->
    <path d="M -54 -14 C -52 -42, -34 -62, -6 -64 C 24 -66, 40 -44, 40 -14 C 40 4, 38 18, 48 28"/>
    <!-- Inner Swirl Loop & Ridge Lines -->
    <path d="M -54 4 C -36 2, -24 -12, -20 -32 C -16 -48, 0 -52, 14 -46 C 26 -40, 28 -22, 26 -2 C 24 16, 28 30, 46 38"/>
    <path d="M -52 22 C -30 18, -14 2, -8 -22 C -4 -36, 12 -34, 14 -18 C 16 2, 12 22, 24 38"/>
    <path d="M -46 38 C -24 32, -6 16, 0 -10"/>
    <!-- Y-Branch Ridge Core above Lower Arch -->
    <path d="M -18 28 C -6 22, 6 22, 18 32"/>
    <path d="M -2 10 L 4 23"/>
    <!-- Bottom Concentric Arch Ridges -->
    <path d="M -44 52 C -26 38, -2 36, 12 46"/>
    <path d="M -38 68 C -22 54, -4 54, 8 64"/>
    <path d="M -26 82 C -14 72, -2 72, 6 80"/>
    <path d="M -14 92 C -8 87, -2 87, 3 91"/>

    <!-- Electric Cyan OS Command Terminal Badge (Bottom-Right) -->
    <g transform="translate(38, 64)" stroke="none">
      <circle cx="0" cy="0" r="34" fill="url(#osBadgeGrad)"/>
      <circle cx="0" cy="0" r="30" fill="none" stroke="#e0f2fe" stroke-opacity="0.35" stroke-width="1.5"/>
      <!-- Command Prompt Chevron >_ in Deep Obsidian -->
      <path d="M -13 -8 L -1 1 L -13 10" fill="none" stroke="#05080f" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="3" y1="10" x2="15" y2="10" stroke="#05080f" stroke-width="5.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
