<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0a3d39"/>
      <stop offset="1" stop-color="#0d6b63"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d4f576"/>
      <stop offset="1" stop-color="#6ee7d4"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <!-- Relay arrow loop — simplified -->
  <!-- Top arc: left to right -->
  <path d="M148 188 Q148 148 188 148 L318 148 Q368 148 368 198 Q368 248 318 248 L228 248"
        fill="none" stroke="url(#accent)" stroke-width="44" stroke-linecap="round"/>
  <!-- Bottom arc: right to left -->
  <path d="M364 264 Q364 364 264 364 L192 364"
        fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="36" stroke-linecap="round"/>
  <!-- Arrow head on bottom arc -->
  <polyline points="222,334 192,364 222,394"
        fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dot accent -->
  <circle cx="390" cy="122" r="24" fill="#d4f576"/>
</svg>
