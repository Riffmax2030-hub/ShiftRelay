<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0a3d39"/>
      <stop offset="1" stop-color="#072724"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d4f576"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- Squircle App Container -->
  <rect width="512" height="512" rx="124" fill="url(#bg)"/>
  
  <!-- Subtle Internal Highlight Ring -->
  <rect x="8" y="8" width="496" height="496" rx="118" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4"/>

  <!-- Left Chevron: Outgoing Shift in Transition (Ghost White/Silver) -->
  <path d="M 152 176 L 272 256 L 152 336"
        fill="none"
        stroke="rgba(255, 255, 255, 0.45)"
        stroke-width="44"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Right Chevron: Incoming Shift in Motion (Electric Emerald/Lime Relay) -->
  <path d="M 248 176 L 368 256 L 248 336"
        fill="none"
        stroke="url(#neon)"
        stroke-width="44"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
