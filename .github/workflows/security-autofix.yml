name: Automated Security Audit & Dependency Autofix

on:
  schedule:
    # Runs every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-and-autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for npm vulnerabilities
        id: audit
        run: |
          if npm audit --audit-level=moderate; then
            echo "vulnerable=false" >> $GITHUB_OUTPUT
          else
            echo "vulnerable=true" >> $GITHUB_OUTPUT
          fi

      - name: Run npm audit fix when vulnerabilities exist
        if: steps.audit.outputs.vulnerable == 'true'
        run: |
          npm audit fix
          npm run build:mobile
          npx cap copy || true

      - name: Verify codebase after autofix
        if: steps.audit.outputs.vulnerable == 'true'
        env:
          ALLOW_DEV_FALLBACK: 'true'
          ALLOW_DEV_DEMO_AUTH: 'true'
          NODE_ENV: development
        run: |
          npm run verify
          npm audit --omit=dev --audit-level=moderate

      - name: Open tested autofix Pull Request
        if: steps.audit.outputs.vulnerable == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/security-autofix
          delete-branch: true
          commit-message: "chore(security): automated npm audit fix"
          title: "chore(security): Automated npm vulnerability autofix"
          body: |
            Automated weekly security audit detected fixable npm advisories, ran `npm audit fix`, rebuilt mobile web assets, and verified all ShiftRelay syntax, unit, compliance, email, and background engine checks (`npm run verify`) pass with zero moderate+ runtime vulnerabilities.
          labels: |
            security
            automated
