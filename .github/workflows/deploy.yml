name: ShiftRelay CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Vulnerability Gate (Production Deps)
        run: npm run audit:check

      - name: Syntax, Unit & Engine Verification
        env:
          ALLOW_DEV_FALLBACK: 'true'
          ALLOW_DEV_DEMO_AUTH: 'true'
          NODE_ENV: development
        run: npm run verify

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Strict GPS & Staff ID Card E2E Verification
        run: node verify_strict_gps_and_card.mjs

      - name: Smoke Test Backend Health & Strict GPS Client Guard
        env:
          ALLOW_DEV_FALLBACK: 'true'
          ALLOW_DEV_DEMO_AUTH: 'true'
          NODE_ENV: development
          PORT: 4000
        run: |
          node server.mjs &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:4000/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:4000/health
          curl -fsS http://localhost:4000/api/health/readiness
          curl -fsS http://localhost:4000/gps-guard.js >/dev/null

  docker-build:
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: shiftrelay/engine:latest
