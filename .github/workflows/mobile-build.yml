name: ShiftRelay Mobile Build (Android & iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Bundle & Sync Capacitor
        run: |
          npm run build:mobile
          npx cap sync android

      - name: Validate Android Project Structure
        run: |
          test -f android/app/build.gradle || exit 1
          test -d android/app/src/main/assets/public || exit 1
          echo "Capacitor Android package successfully prepared and verified."
