name: ShiftRelay Mobile Build (Android & iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 21 (Required for Capacitor 8)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Bundle
        run: npm run build:mobile

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Validate Android Project Structure & Assets
        run: |
          test -f android/app/build.gradle || exit 1
          test -d android/app/src/main/assets/public || exit 1
          echo "Capacitor Android package successfully prepared and verified."
