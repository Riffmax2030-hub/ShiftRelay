name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21 (Required for Capacitor 8)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Bundle & Tablet Assets
        run: npm run build:mobile

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Copy Assets to Android & Update Native Config
        run: |
          npx cap copy android
          npx cap update android || echo "Native plugin configuration already synchronized in repository."

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK was created
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          test -f android/app/build/outputs/apk/debug/app-debug.apk || exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiftRelay-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
