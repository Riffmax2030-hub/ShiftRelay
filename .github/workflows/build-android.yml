name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 21 (Required for Capacitor 8)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Bundle & Tablet Assets
        run: npm run build:mobile

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Copy Assets to Android & Update Native Config
        run: |
          npx cap copy android
          npx cap update android || echo "Native plugin configuration already synchronized in repository."

      - name: Setup Android SDK Tools & Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true

      - name: Build Debug APK with Gradle
        id: gradle_build
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle-build.log
        continue-on-error: true

      - name: Print Gradle Error Log If Failed
        if: steps.gradle_build.outcome != 'success'
        run: |
          echo "### Gradle Build Log (Tail 100 Lines):" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 100 gradle-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "==== LAST 100 LINES OF GRADLE LOG ===="
          tail -n 100 gradle-build.log
          exit 1

      - name: Find and verify APK
        run: |
          echo "=== Searching for APK files ==="
          find android -name "*.apk" 2>/dev/null || true
          echo "=== Listing debug output dir ==="
          ls -lh android/app/build/outputs/apk/ 2>/dev/null || echo "No apk output dir found"
          ls -lhR android/app/build/outputs/ 2>/dev/null || echo "No outputs dir found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShiftRelay-Debug-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 14
          if-no-files-found: warn
