services:
  - type: web
    name: shiftrelay
    env: node
    plan: starter
    buildCommand: npm ci
    startCommand: node server.mjs
    healthCheckPath: /api/health/readiness
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: ALLOW_DEV_FALLBACK
        value: false
      - key: ALLOW_DEV_DEMO_AUTH
        value: false
      - key: APP_URL
        value: https://app.shiftrelayos.com
      - key: WEBSITE_URL
        value: https://shiftrelayos.com
      - key: WEBSITE_HOSTS
        value: shiftrelayos.com,www.shiftrelayos.com
      - key: ADMIN_HOSTS
        value: admin.shiftrelayos.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://shiftrelayos.com,https://www.shiftrelayos.com,https://app.shiftrelayos.com,https://admin.shiftrelayos.com,https://shiftrelay-vjkf.onrender.com
      - key: FROM_EMAIL
        value: '"ShiftRelay OS by Riffmax Technology Limited" <notifications@shiftrelayos.com>'
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CARD_SIGNING_SECRET
        sync: false
      - key: SHIFTRELAY_ADMIN_BOOTSTRAP_PASS
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
