    </nav>

  <main>
    <div class="banner">
      <div>
        <div style="font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--em); font-weight:700;">LIVE READINESS PROBE (/api/health/readiness)</div>
        <h1 style="font-family:'Outfit',sans-serif; font-size:28px; font-weight:900; margin-top:4px;" id="overall-status-title">Checking ShiftRelay Systems...</h1>
        <div style="font-size:13px; color:var(--muted);" id="overall-status-meta">Contacting Lagos / Edge telemetry...</div>
      </div>
      <button type="button" class="btn-refresh" onclick="loadLiveStatus()">Refresh Probe</button>
    </div>

    <div class="status-list" id="status-components-list"></div>
  </main>

  <script>
    async function loadLiveStatus() {
      const list = document.getElementById('status-components-list');
      const title = document.getElementById('overall-status-title');
      const meta = document.getElementById('overall-status-meta');
      try {
        const res = await fetch('/api/health/readiness');
        const data = await res.json();
        title.textContent = data.status === 'READY' ? 'All Core Subsystems Operational' : 'Degraded Telemetry';
        meta.textContent = `Release ${data.version} · Storage: ${data.databaseMode} · Uptime: ${data.uptimeSeconds}s · Checked ${new Date(data.timestamp).toLocaleTimeString()}`;
        const comps = Object.values(data.components || {});
        list.innerHTML = comps.map(c => `
          <div class="svc-card">
            <div>
              <strong style="font-size:15.5px; color:#0f172a;">${c.name}</strong>
              <div style="font-size:12.5px; color:#475569; margin-top:2px;">
                ${c.tickSeconds ? 'Automated loop every ' + c.tickSeconds + 's' : c.variance ? 'Statutory reconciliation variance: ' + c.variance : c.latencyMs ? 'App & API response ready' : 'Verified relay channel'}
              </div>
            </div>
            <span class="badge">${c.status}</span>
          </div>
        `).join('');
      } catch (err) {
        title.textContent = 'Telemetry Endpoint Unreachable';
        meta.textContent = err?.message || 'Network connection error';
      }
    }
    loadLiveStatus();
  </script>
